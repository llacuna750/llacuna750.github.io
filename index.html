    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://llacuna750.github.io/#website",
            "url": "https://llacuna750.github.io/",
            "name": "Gabriel Llacuna | Web Development Portfolio",
            "inLanguage": "en",
            "publisher": { "@id": "https://llacuna750.github.io/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://llacuna750.github.io/#person",
            "name": "Gabriel Llacuna",
            "url": "https://llacuna750.github.io/",
            "image": "https://llacuna750.github.io/og-image-shin.png",
            "description": "Web development learner in the Philippines building skills across frontend and backend technologies.",

              "HTML",
              "CSS",

            ]
          }
        ]
      }
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-shin.png?v=1" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          const theme = savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'dark' ? '#0c1222' : '#f7f8fc',
          )
        } catch {
          // Keep the default light theme if browser storage is unavailable.
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
