name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, portfolio-deploy]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Get public GitHub contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          START_DATE=$(date -u -d '1 year ago' +%Y-%m-%dT00:00:00Z)
          END_DATE=$(date -u +%Y-%m-%dT23:59:59Z)
          gh api graphql \
            -f query='query($login: String!, $from: DateTime!, $to: DateTime!) { user(login: $login) { contributionsCollection(from: $from, to: $to) { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount contributionLevel } } } } } }' \
            -f login='llacuna750' \
            -f from="$START_DATE" \
            -f to="$END_DATE" \
            --jq '.data.user.contributionsCollection.contributionCalendar' \
            > public/github-contributions.json

      - name: Build the website
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
